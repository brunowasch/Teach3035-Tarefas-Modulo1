    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculadora</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="container">
            <div id="container-result">
                <div id="display">
                    <div class="result"></div>
                </div>
            </div>
            <div id="container-numbers">
                <div id="numbers">
                    <button class="key action" id="clearAll">CE</button>
                    <button class="key action" id="clearOperation">C</button>
                    <button class="key action" id="clearLastNumber">DEL</button>
                    <button class="key number">7</button>
                    <button class="key number">8</button>
                    <button class="key number">9</button>
                    <button class="key number">4</button>
                    <button class="key number">5</button>
                    <button class="key number">6</button>
                    <button class="key number">1</button>
                    <button class="key number">2</button>
                    <button class="key number">3</button>
                    <button class="key action">+/-</button>
                    <button class="key number">0</button>
                    <button class="key action">.</button>
                </div>
                <div id="operators">
                    <button class="key operator">/</button>
                    <button class="key operator">*</button>
                    <button class="key operator">-</button>
                    <button class="key operator">+</button>
                    <button class="key action" id="equal">=</button>
                </div>    
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
